name: Seed Goszakup Contracts

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync seed script
        run: |
          rsync -az prisma/seed-goszakup.ts \
            root@${{ secrets.DEPLOY_HOST }}:/var/www/amanat/prisma/seed-goszakup.ts

      - name: Run seed on server
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} bash << 'ENDSSH'
            set -e
            cd /var/www/amanat
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/amanat?schema=public \
              npx tsx prisma/seed-goszakup.ts
            echo "✅ Goszakup seed complete at $(date)"
          ENDSSH
