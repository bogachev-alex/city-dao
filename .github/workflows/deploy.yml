name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next/cache' \
            . root@${{ secrets.DEPLOY_HOST }}:/var/www/amanat/

      - name: Restart app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} "
            cd /var/www/amanat &&
            grep -q 'OPENAI_API_KEY' .env.local && sed -i \"s|OPENAI_API_KEY=.*|OPENAI_API_KEY=$OPENAI_API_KEY|\" .env.local || echo \"OPENAI_API_KEY=$OPENAI_API_KEY\" >> .env.local &&
            npm install --production=false --legacy-peer-deps --silent &&
            npx prisma generate &&
            npx prisma migrate deploy &&
            pm2 restart amanat --update-env &&
            pm2 save &&
            echo '✅ Deployed at \$(date)'
          "
