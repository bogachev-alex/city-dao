name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'components/**/*.ts', 'components/**/*.tsx', 'lib/**/*.ts', 'lib/**/*.tsx', 'messages/**/*.json', 'next.config.js', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Ensure testing-library DOM peer
        run: npm install --no-save @testing-library/dom@10.4.1 --legacy-peer-deps --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next/cache' \
            --exclude='target' \
            --exclude='programs' \
            . root@${{ secrets.DEPLOY_HOST }}:/var/www/straita/

      - name: Restart app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} bash << ENDSSH
            set -e
            cd /var/www/straita
            printf 'OPENAI_API_KEY=%s\nDATABASE_URL=postgresql://postgres:postgres@localhost:5432/straita?schema=public\nPINATA_JWT=%s\n' "${OPENAI_API_KEY}" "${PINATA_JWT}" > .env.local
            npm install --production=false --legacy-peer-deps --silent
            npx prisma generate
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/straita?schema=public npx prisma migrate deploy
            pm2 restart straita --update-env
            pm2 save
            echo "✅ Deployed at $(date)"
          ENDSSH
