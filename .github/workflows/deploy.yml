name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next/cache' \
            --exclude='target' \
            --exclude='programs' \
            . root@${{ secrets.DEPLOY_HOST }}:/var/www/amanat/

      - name: Restart app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} bash << ENDSSH
            set -e
            cd /var/www/amanat
            printf 'OPENAI_API_KEY=%s\nDATABASE_URL=postgresql://postgres:postgres@localhost:5432/amanat?schema=public\n' "${OPENAI_API_KEY}" > .env.local
            npm install --production=false --legacy-peer-deps --silent
            npx prisma generate
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/amanat?schema=public npx prisma migrate deploy
            pm2 restart amanat --update-env
            pm2 save
            echo "✅ Deployed at $(date)"
          ENDSSH
