[package]
name = "penalty-engine"
version = "0.1.0"
description = "Straita — Automatic Penalty Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "penalty_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
district-treasury = { path = "../district_treasury", features = ["cpi"] }
contract-registry = { path = "../contract_registry", features = ["cpi"] }
